---
- name: Afficher les infos de distribution pour debug
  debug:
    msg: "Distribution: {{ ansible_distribution }}, Version: {{ ansible_distribution_version }}"

- name: Inclure les tâches pour Debian
  include_tasks: "setup-Debian-{{ ansible_distribution_version.split('.')[0] }}.yml"
  when: ansible_distribution == "Debian"

- name: Inclure les tâches pour Alpine
  include_tasks: "setup-Alpine-{{ ansible_distribution_version.split('.')[:2] | join('.') }}.yml"
  when: ansible_distribution == "Alpine"

- name: Inclure les tâches pour Rocky
  include_tasks: "setup-RockyLinux-{{ ansible_distribution_version.split('.')[0] }}.yml"
  when: ansible_distribution == "Rocky"