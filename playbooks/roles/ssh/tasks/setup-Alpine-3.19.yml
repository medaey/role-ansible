---
# Installation des paquets
- name: Installation des PAQUETS
  community.general.apk:
    name: [openssh-server, openssh-server-pam, nano]
    state: latest
    update_cache: true

- name: Vérifier si le répertoire /etc/ssh/sshd_config.d existe
  stat:
    path: /etc/ssh/sshd_config.d
  register: sshd_config_d

- name: Créer le répertoire /etc/ssh/sshd_config.d
  file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: '0755'
  when: not sshd_config_d.stat.exists

- name: "SSH - Importation des configuration"
  block:
    - name: "SSH - Configuration de sshd"
      ansible.builtin.template:
        src: "../templates/{{ item.src }}" # Correction ici : chemin direct
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
        owner: root
        group: root
      loop:
        - { src: "etc.ssh.sshd_config.j2", dest: "/etc/ssh/sshd_config", mode: "0600" }
        - { src: "etc.ssh.banner.j2", dest: "/etc/ssh/banner", mode: "0600" }
  become: true
  # On enlève ignore_errors pour voir les vraies erreurs de template s'il y en a

- name: Commenter les options non supportées par Alpine
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    insertbefore: BOF
  loop:
    - { regexp: '.*GSSAPIAuthentication.*', line: '#GSSAPIAuthentication no' }
    - { regexp: 'GSSAPIKeyExchange.*', line: '#GSSAPIKeyExchange no' }
    - { regexp: '.*KerberosAuthentication.*', line: '#KerberosAuthentication no' }
    - { regexp: '.*PrintLastLog.*', line: '#PrintLastLog no' }
  notify: restart sshd