name: Molecule Multi-OS Test
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # On définit ici les OS que tu veux tester en parallèle
        distro: [ubuntu2204, rockylinux9, debian12]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install "ansible-dev-tools" molecule-plugins[docker]

      - name: Run Molecule
        run: molecule test
        working-directory: playbooks/roles/ssh # Chemin vers ton rôle
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}